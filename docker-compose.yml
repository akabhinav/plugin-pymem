services:
  pymem-api:
    build: .
    ports: ["8001:8001"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/kuzu:/app/data/kuzu
    command: uvicorn pymem.main:app --host 0.0.0.0 --port 8001

  pymem-worker:
    build: .
    command: celery -A pymem.tasks.celery_app worker --loglevel=info -c 4
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  pymem-beat:
    build: .
    command: celery -A pymem.tasks.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  pymem-streamlit:
    build: .
    ports: ["8501:8501"]
    env_file: .env
    command: streamlit run pymem/ui/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - pymem-api

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: pymem
      POSTGRES_USER: pymem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pymem}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pymem"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

volumes:
  pgdata:
