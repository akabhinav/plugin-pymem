[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymem"
version = "1.0.0"
description = "Production-grade four-type memory platform for AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "PyMem Team" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "httpx>=0.27.0",
    "celery[redis]>=5.4.0",
    "structlog>=24.4.0",
    "pgvector>=0.3.0",
    "sentence-transformers>=3.3.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "prometheus-client>=0.21.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.12.0"]
neo4j = ["neo4j>=5.26.0"]
kuzu = ["kuzu>=0.7.0"]
chroma = ["chromadb>=0.5.0"]
milvus = ["pymilvus>=2.4.0"]
mcp = ["fastmcp>=0.1.0"]
streamlit = ["streamlit>=1.40.0", "plotly>=5.24.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "testcontainers>=4.8.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]
all = [
    "pymem[qdrant,neo4j,kuzu,chroma,milvus,mcp,streamlit,dev]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["pymem"]
